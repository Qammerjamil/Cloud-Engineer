site_name: Qammer Jamil | Cloud Engineer Portfolio
site_description: Professional portfolio and documentation for a Cloud Engineer
site_author: Qammer Jamil
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Projects:
      - Project 01: projects/project_01.md
      - Project 02: projects/project_02.md
  - Skills: skills.md
  - Resume: resume.md
  - About: about.md
  - Blog:
      - Blog Home: blog/index.md
      - How to Build a Secure AWS VPC: blog/aws-vpc.md
      - CI/CD Pipeline with GitHub Actions: blog/github-actions-cicd.md
      - Terraform Best Practices: blog/terraform-best-practices.md

repo_url: https://github.com/Qammerjamil
repo_name: GitHub
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/qammer-jamil-b62850277/
    - icon: fontawesome/brands/github
      link: https://github.com/Qammerjamil

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true